<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    @keyframes luxury-swing {
      0%, 100% {
        transform: rotate(-3deg) translateY(-2px) translateZ(0);
      }
      50% {
        transform: rotate(3deg) translateY(2px) translateZ(0);
      }
    }

    .animate-luxury-swing {
      display: inline-block;
      animation: luxury-swing var(--swing-duration, 3s) ease-in-out infinite alternate var(--swing-delay, 0s);
      will-change: transform;
      transform-origin: top center;
    }

    .luxury-glow {
      text-shadow: 0 0 15px rgba(251, 191, 36, 0.4), 0 0 30px rgba(251, 191, 36, 0.2);
    }
  </style>
</head>
<body style="background: black; color: white; font-family: serif; text-align: center; font-size: 5rem;">
  <span class="animate-luxury-swing luxury-glow" style="--swing-duration: 3s; --swing-delay: 0s">H</span>
  <span class="animate-luxury-swing luxury-glow" style="--swing-duration: 3.2s; --swing-delay: 0.1s">A</span>
  <span class="animate-luxury-swing luxury-glow" style="--swing-duration: 2.9s; --swing-delay: 0.2s">I</span>
  <span class="animate-luxury-swing luxury-glow" style="--swing-duration: 3.4s; --swing-delay: 0.3s">R</span>
</body>
</html>
